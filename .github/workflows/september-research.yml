name: September causal research checks
on:
  push:
    branches: [research/september-4h-1h-1m-20261009]
    paths: ['research/september_2026/**', '.github/workflows/september-research.yml']
  pull_request:
    paths: ['research/september_2026/**', '.github/workflows/september-research.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: september-research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.11']
    defaults:
      run:
        working-directory: research/september_2026
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/september-matplotlib-${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install report dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-report.txt
      - name: Verify frozen research contracts
        run: |
          mkdir -p ci-artifacts
          set -o pipefail
          python -B -m unittest test_engine test_month_replay test_export_tradingview test_verify_causality test_report test_native_daily test_independent_boundaries test_role_review 2>&1 | tee ci-artifacts/unit-tests.log
      - name: Attack pipeline handoffs with explicit synthetic data
        run: |
          set -o pipefail
          python -B regression_pipeline.py --project . --fixture fixtures/pipeline --output ci-artifacts/pipeline 2>&1 | tee ci-artifacts/pipeline.log
      - name: Verify source collector with offline synthetic transport
        run: |
          set -o pipefail
          python -B acquisition_tools/verify_offline.py 2>&1 | tee ci-artifacts/acquisition-tests.log
      - name: Publish checks and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: september-research-python-${{ matrix.python }}
          if-no-files-found: error
          retention-days: 30
          path: research/september_2026/ci-artifacts/
      - name: State verification scope
        if: always()
        run: |
          python - <<'PYCODE'
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('Synthetic contract checks and a small source-decoding fixture only. No full-month market backtest, teacher-fidelity, performance, TradingView delivery, or trading clearance is implied. Inspect step conclusions and preserved artifacts.\n')
          PYCODE
