name: ASTRA 6 engine checks
on:
  push:
    branches: [research/september-4h-1h-1m-20261009]
    paths: ['research/september_2026/**', 'tests/test_logic.py', 'automations/**', '.github/workflows/september-research.yml']
  pull_request:
    paths: ['research/september_2026/**', 'tests/test_logic.py', 'automations/**', '.github/workflows/september-research.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: september-research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.11']
    defaults:
      run:
        working-directory: research/september_2026
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/september-matplotlib-${{ matrix.python }}
      ASTRA_CHECK_OUTPUT: ${{ runner.temp }}/astra6-engine-checks-${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install report dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-report.txt
      - name: Run all engine and offline pipeline checks
        if: ${{ !cancelled() }}
        run: python -B verify_all.py --output "$ASTRA_CHECK_OUTPUT"
      - name: Publish checks and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: september-research-python-${{ matrix.python }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ env.ASTRA_CHECK_OUTPUT }}/
      - name: State verification scope
        if: always()
        run: |
          python - <<'PYCODE'
          import json
          import os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              path = Path(os.environ['ASTRA_CHECK_OUTPUT']) / 'RESULT.json'
              if path.is_file():
                  result = json.loads(path.read_text())
                  f.write('### ASTRA 6 engine checks\n\n')
                  f.write('All required checks passed: **' + str(result.get('all_pass') is True) + '**\n\n')
                  f.write('```json\n' + json.dumps(result.get('counts', {}), indent=2) + '\n```\n\n')
              else:
                  f.write('### ASTRA 6 engine checks\n\nNo complete result receipt was produced. Inspect the failed steps.\n\n')
              f.write('Synthetic contract checks and a small source-decoding fixture only. No full-month market backtest, teacher-fidelity, performance, TradingView delivery, or trading clearance is implied. Inspect step conclusions and preserved artifacts.\n')
          PYCODE
