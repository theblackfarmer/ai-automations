name: ASTRA asymmetric exit research
on:
  push:
    branches:
      - research/astra6-asymmetric-runner-20261031
    paths:
      - 'research/astra_asymmetric_exit_study.py'
      - '.github/workflows/astra_asymmetric_exit_research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy pyarrow scipy
      - name: Build frozen discovery events from 2022-2025 NQ
        run: python astra6_causal_transition_engine.py
      - name: Test fixed versus 15-minute runner exits
        run: python research/astra_asymmetric_exit_study.py
      - name: Upload detailed comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-asymmetric-exit-research
          if-no-files-found: warn
          path: |
            astra6_causal_summary.csv
            research_asymmetry_observations.csv
            research_asymmetry_summary.csv
