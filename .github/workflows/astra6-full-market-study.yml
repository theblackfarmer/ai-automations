name: ASTRA 6 full frozen market study

on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: 'Prior acquisition run whose complete saved target must be restored'
        required: true
        type: string
      max_requests:
        description: 'Bounded additional requests; cached validated hours are reused'
        required: true
        default: '48'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: astra6-frozen-acquisition-202608-202609
  cancel-in-progress: false

jobs:
  frozen-study:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Set output paths
        shell: bash
        run: |
          echo "ACQ=${RUNNER_TEMP}/astra6-full-acquisition" >> "${GITHUB_ENV}"
          echo "STUDY=${RUNNER_TEMP}/astra6-full-study" >> "${GITHUB_ENV}"

      - name: Validate bounded resume inputs
        env:
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          REQUEST_LIMIT: ${{ inputs.max_requests }}
        run: |
          python3 - <<'PYCODE'
          import os
          run_id = os.environ['RESUME_RUN_ID']
          budget = os.environ['REQUEST_LIMIT']
          if not run_id.isdecimal() or not budget.isdecimal() or not 0 <= int(budget) <= 96:
              raise SystemExit('Expected numeric prior run ID and request budget between 0 and 96')
          PYCODE

      - name: Restore preserved acquisition target
        uses: actions/download-artifact@v4
        with:
          name: astra6-full-market-study-${{ inputs.resume_run_id }}
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/restored-acquisition

      - name: Adopt restored target without discarding receipts
        run: |
          test -f "${RUNNER_TEMP}/restored-acquisition/astra6-full-acquisition/MONTH_IDENTITY.json"
          test -f "${RUNNER_TEMP}/restored-acquisition/astra6-full-acquisition/MANIFEST.json"
          mv "${RUNNER_TEMP}/restored-acquisition/astra6-full-acquisition" "${ACQ}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify acquisition package
        working-directory: research/september_2026/acquisition_tools
        run: |
          python -I -S -B verify_offline.py
          python -B -m unittest -v test_daily_codec_v5.py test_resume_acquisition.py

      - name: Acquire frozen August-September USATECHIDXUSD ticks
        id: acquire
        env:
          REQUEST_LIMIT: ${{ inputs.max_requests }}
        working-directory: research/september_2026/acquisition_tools
        shell: bash
        run: |
          set +e
          python -B resume_acquisition.py \
            --protocol FROZEN_MONTH_PROTOCOL.json \
            --target "${ACQ}" \
            --route direct-https \
            --max-requests "${REQUEST_LIMIT}" \
            --max-seconds 900 \
            --execute | tee "${RUNNER_TEMP}/full-acquisition.log"
          rc=${PIPESTATUS[0]}
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          if [ "${rc}" -ne 0 ] && [ "${rc}" -ne 2 ]; then
            exit "${rc}"
          fi

      - name: Preserve acquisition before study
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra6-full-market-study-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/astra6-full-acquisition/
            ${{ runner.temp }}/full-acquisition.log

      - name: Validate full acquisition gate
        id: gate
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = Path(os.environ['ACQ']) / 'MANIFEST.json'
          if not manifest.is_file():
              raise SystemExit('No acquisition MANIFEST.json')
          m = json.loads(manifest.read_text())
          complete = m.get('all_hours_validated_or_explicit_empty_200') is True
          expected = m.get('expected_hours')
          processed = m.get('processed_hours')
          states = m.get('hour_states', {})
          unresolved = m.get('unresolved_hours', [])
          unattempted = m.get('unattempted_hours', [])
          if complete:
              if processed != expected or unresolved or unattempted:
                  raise SystemExit('Contradictory complete acquisition manifest')
          out = os.environ['GITHUB_OUTPUT']
          with open(out, 'a') as f:
              f.write('complete=' + ('true' if complete else 'false') + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('### ASTRA 6 full acquisition\n\n')
              f.write('Complete: **' + str(complete) + '**\n\n')
              f.write('Expected hours: **' + str(expected) + '**  \\n')
              f.write('Processed hours: **' + str(processed) + '**  \\n')
              f.write('Minute count: **' + str(m.get('minute_count')) + '**\n\n')
              f.write('```json\n' + json.dumps({
                  'hour_states': states,
                  'missing_minutes': m.get('missing_minutes'),
                  'stop_reason': m.get('stop_reason'),
                  'network_requests_this_run': m.get('network_requests_this_run'),
                  'unresolved_hours_count': len(unresolved),
                  'unattempted_hours_count': len(unattempted),
              }, indent=2) + '\n```\n')
          PY

      - name: Run frozen ASTRA causal study
        if: steps.gate.outputs.complete == 'true'
        working-directory: research/september_2026
        run: |
          python -B run_study.py \
            --acquisition "${ACQ}/MANIFEST.json" \
            --output "${STUDY}"

      - name: Summarize ASTRA study
        if: steps.gate.outputs.complete == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          study = Path(os.environ['STUDY'])
          pipeline = json.loads((study/'PIPELINE.json').read_text())
          result = json.loads((study/'replay'/'RESULT.json').read_text())
          report = json.loads((study/'report'/'REPORT.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n### ASTRA 6 frozen causal study\n\n')
              f.write('Pipeline: **' + str(pipeline.get('status')) + '**\n\n')
              f.write('September events: **' + str(result.get('september_events')) + '**\n\n')
              f.write('```json\n' + json.dumps({
                  'event_counts': result.get('event_counts'),
                  'causal_scope': pipeline.get('causal_scope'),
                  'execution_allowed': pipeline.get('execution_allowed'),
                  'performance': result.get('performance'),
                  'report_status': report.get('status'),
              }, indent=2) + '\n```\n')
          PY

      - name: Preserve study outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra6-study-results-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/astra6-full-study/
            ${{ runner.temp }}/full-acquisition.log
