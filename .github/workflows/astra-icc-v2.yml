name: Astra 6 Frozen Research

on:
  push:
    paths:
      - 'astra_research/**'
      - 'research/astra6/**'
      - 'tests/test_research*.py'
      - 'tests/test_astra_v6_icc_v2.py'
      - 'tests/test_icc_v2.py'
      - 'test_astra_v6_icc_event_identity.py'
      - 'astra_v6_icc_event_engine_v2.py'
      - 'requirements-astra.txt'
      - '.github/workflows/astra-icc-v2.yml'
      - '.github/workflows/astra-icc-v2-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    name: Frozen ASTRA 6 research
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-astra.txt
      - name: Prepare evidence directory
        run: mkdir -p results/astra6
      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-astra.txt 2>&1 | tee results/astra6/dependencies.log
          python -m pip freeze > results/astra6/environment.txt
      - name: Acquire and verify immutable research inputs
        run: |
          set -euo pipefail
          python -m astra_research.acquire --output data_cache 2>&1 | tee results/astra6/acquisition.log
          cp data_cache/acquisition_manifest.json results/astra6/
      - name: Regression and historical semantics checks
        run: |
          set -euo pipefail
          python -m pytest -v tests/test_research*.py tests/test_astra_v6_icc_v2.py tests/test_icc_v2.py --junitxml=results/astra6/tests.xml 2>&1 | tee results/astra6/tests.log
          python test_astra_v6_icc_event_identity.py 2>&1 | tee results/astra6/legacy-identity.log
      - name: Run frozen research and causal verification
        run: |
          set -euo pipefail
          python -m astra_research.run --data-dir data_cache --output results/astra6 2>&1 | tee results/astra6/research.log
      - name: Record workflow outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p results/astra6
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          record = {"status": os.environ["JOB_STATUS"], "commit": os.environ["GITHUB_SHA"],
                    "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                    "url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}
          Path("results/astra6/workflow_outcome.json").write_text(json.dumps(record, indent=2) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(f"## ASTRA 6 research\n\nWorkflow outcome: **{record['status']}**\n\nCommit: `{record['commit']}`\n\nResearch and deployment verdicts are in the generated evidence; workflow completion alone does not establish profitability.\n")
          PYTHON
      - name: Preserve research evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: astra6-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/astra6/
          if-no-files-found: error
          retention-days: 90
