name: ASTRA 6 public data availability probe
on:
  push:
    branches: [research/astra6-profit-validation-20261022]
    paths:
      - .github/workflows/astra6-profit-data-probe.yml
      - research/astra6_profitability/PROBE_PROTOCOL.json
permissions:
  contents: read
concurrency:
  group: astra6-profit-data-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-source-hour:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare evidence directory
        run: |
          mkdir -p "$RUNNER_TEMP/astra6-profit-data-probe"
          echo "ASTRA_PROBE_OUTPUT=$RUNNER_TEMP/astra6-profit-data-probe" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record exact source inputs
        run: |
          git rev-parse HEAD > "$ASTRA_PROBE_OUTPUT/SOURCE_COMMIT.txt"
          cp research/astra6_profitability/PROBE_PROTOCOL.json "$ASTRA_PROBE_OUTPUT/REQUEST_PROTOCOL.json"
          sha256sum research/september_2026/acquisition_tools/acquire_month_v4.py research/september_2026/acquisition_tools/legacy_acquire.py research/september_2026/acquisition_tools/FROZEN_MONTH_PROTOCOL.json research/astra6_profitability/PROBE_PROTOCOL.json > "$ASTRA_PROBE_OUTPUT/SOURCE_HASHES.txt"
      - name: Acquire one source hour with the unchanged collector
        run: |
          set +e
          python -B research/september_2026/acquisition_tools/acquire_month_v4.py --protocol research/astra6_profitability/PROBE_PROTOCOL.json --target "$ASTRA_PROBE_OUTPUT/acquisition" --max-requests 2 --route direct-https --execute 2>&1 | tee "$ASTRA_PROBE_OUTPUT/collector.log"
          command_status=("${PIPESTATUS[@]}")
          collector_status=${command_status[0]}
          log_status=${command_status[1]}
          set -e
          printf '%s\n' "$collector_status" > "$ASTRA_PROBE_OUTPUT/COLLECTOR_EXIT_CODE.txt"
          if [ "$collector_status" -ne 0 ]; then exit "$collector_status"; fi
          exit "$log_status"
      - name: Preserve raw responses and all acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra6-profit-data-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/astra6-profit-data-probe/
          if-no-files-found: error
          retention-days: 30
      - name: State the probe scope
        if: always()
        run: |
          echo 'One public source hour only. Read the collector exit code and MANIFEST.json in the artifact. A successful probe establishes source availability and decoding for that hour; it supplies no full-month coverage, trading result, or execution clearance.' >> "$GITHUB_STEP_SUMMARY"
