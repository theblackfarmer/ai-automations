name: Astra NQ Bars

on:
  push:
    paths:
      - '.github/workflows/astra-nq-bars.yml'
      - 'astra_nq_bars.py'
      - 'astra_transition_feature_audit.py'
      - 'astra6_causal_transition_engine.py'
  workflow_dispatch:

jobs:
  bars:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy pyarrow scipy
      - name: Run Astra 6 causal transition engine
        run: python astra6_causal_transition_engine.py
      - name: Run Astra 6 legacy discovery baseline
        run: python astra_nq_bars.py
      - name: Run Astra 6 Feature Audit
        run: python astra_transition_feature_audit.py
      - name: Publish Astra results
        uses: actions/upload-artifact@v4
        with:
          name: astra6-nq-transition-results
          path: |
            astra6_causal_setups.parquet
            astra6_causal_summary.csv
            astra_transition_events.parquet
            astra_transition_summary.csv
            astra_transition_feature_bins.csv
            astra_transition_stability.csv
