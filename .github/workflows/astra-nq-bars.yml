name: Astra Legacy Discovery Replay (not deployment validation)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bars:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Prepare legacy evidence directory
        run: mkdir -p results/legacy
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-astra.txt 2>&1 | tee results/legacy/dependencies.log
      - name: Run Astra 6 causal transition engine
        run: |
          set -euo pipefail
          python astra6_causal_transition_engine.py 2>&1 | tee results/legacy/astra6_causal_transition_engine.py.log
      - name: Run Astra 6 legacy discovery baseline
        run: |
          set -euo pipefail
          python astra_nq_bars.py 2>&1 | tee results/legacy/astra_nq_bars.py.log
      - name: Run Astra 6 Feature Audit
        run: |
          set -euo pipefail
          python astra_transition_feature_audit.py 2>&1 | tee results/legacy/astra_transition_feature_audit.py.log
      - name: Publish Astra results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legacy-unaudited-discovery-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          path: |
            results/legacy/
            astra6_causal_setups.parquet
            astra6_causal_summary.csv
            astra_transition_events.parquet
            astra_transition_summary.csv
            astra_transition_feature_bins.csv
            astra_transition_stability.csv
