name: Astra NQ Bars

on:
  push:
    paths:
      - '.github/workflows/astra-nq-bars.yml'
      - 'astra_nq_bars.py'
  workflow_dispatch:

jobs:
  bars:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy pyarrow
      - name: Download and inspect real NQ 1m bars
        run: python astra_nq_bars.py
