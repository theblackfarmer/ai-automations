name: ASTRA 6 market data probe

on:
  push:
    branches: [fix/astra6-engine-tests-20261022]
    paths:
      - '.github/workflows/astra6-market-data-probe.yml'
      - 'research/september_2026/acquisition_tools/daily_codec_v5.py'
      - 'research/september_2026/acquisition_tools/test_daily_codec_v5.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astra6-market-data-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  direct-dukascopy-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: research/september_2026/acquisition_tools
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify frozen acquisition package offline
        run: python -I -S -B verify_offline.py

      - name: Verify daily BI5 V5 decoder
        run: python -B -m unittest -v test_daily_codec_v5.py

      - name: Build active-session probe protocol
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('FROZEN_MONTH_PROTOCOL.json').read_text())
          p['start_utc'] = '2026-08-03T14:00:00Z'
          p['end_exclusive_utc'] = '2026-08-03T18:00:00Z'
          Path('ACTIVE_SESSION_PROTOCOL.json').write_text(json.dumps(p, indent=2) + '\n')
          PY

      - name: Acquire bounded direct-HTTPS active-session sample
        id: acquire
        shell: bash
        run: |
          set +e
          TARGET="${RUNNER_TEMP}/astra6-dukascopy-probe"
          python -B acquire_month_v4.py \
            --protocol ACTIVE_SESSION_PROTOCOL.json \
            --target "${TARGET}" \
            --route direct-https \
            --max-requests 8 \
            --execute | tee "${RUNNER_TEMP}/acquisition.log"
          rc=${PIPESTATUS[0]}
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          if [ "${rc}" -ne 0 ] && [ "${rc}" -ne 2 ]; then
            exit "${rc}"
          fi

      - name: Summarize acquisition receipt
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          target = Path(os.environ['RUNNER_TEMP']) / 'astra6-dukascopy-probe'
          manifest = target / 'MANIFEST.json'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('### ASTRA 6 Dukascopy probe\n\n')
              f.write('Acquisition exit code: **' + '${{ steps.acquire.outputs.exit_code }}' + '**\n\n')
              if manifest.is_file():
                  m = json.loads(manifest.read_text())
                  safe = {k:m.get(k) for k in (
                      'network_requests_this_run','stop_reason','processed_hours',
                      'expected_hours','hour_states','minute_count','missing_minutes',
                      'all_hours_validated_or_explicit_empty_200','wire_route')}
                  f.write('```json\n' + json.dumps(safe, indent=2) + '\n```\n')
              else:
                  f.write('No MANIFEST.json was produced. Inspect acquisition.log.\n')
          PY

      - name: Preserve source receipts and probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra6-dukascopy-probe-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/astra6-dukascopy-probe/
            ${{ runner.temp }}/acquisition.log

# active-session probe
