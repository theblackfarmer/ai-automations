name: ASTRA 6 quote research checks
on:
  pull_request:
    paths:
      - research/astra6_profitability/**
      - research/september_2026/**
      - .github/workflows/astra6-profit-tests.yml
  push:
    branches: [research/september-4h-1h-1m-20261009]
    paths:
      - research/astra6_profitability/**
      - research/september_2026/**
      - .github/workflows/astra6-profit-tests.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astra6-quote-research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  all-offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.11']
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned engine report dependency
        run: python -m pip install --disable-pip-version-check -r research/september_2026/requirements-report.txt
      - name: Run all quote research tests
        if: ${{ !cancelled() }}
        run: python -B research/astra6_profitability/verify_profit.py --output "$RUNNER_TEMP/astra6-profit-checks/quote"
      - name: Run all frozen engine and pipeline tests
        if: ${{ !cancelled() }}
        run: python -B research/september_2026/verify_all.py --output "$RUNNER_TEMP/astra6-profit-checks/engine"
      - name: Preserve checks and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra6-quote-research-python-${{ matrix.python }}
          path: ${{ runner.temp }}/astra6-profit-checks/
          if-no-files-found: error
          retention-days: 30
      - name: State verification scope
        if: always()
        run: echo 'Offline software checks only. They do not establish market profitability, untouched out-of-sample performance, actual broker fills, or live execution approval.' >> "$GITHUB_STEP_SUMMARY"
