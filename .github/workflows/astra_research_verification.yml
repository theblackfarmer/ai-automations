name: ASTRA research verification
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'research/**'
      - 'astra6_causal_transition_engine.py'
      - '.github/workflows/astra_research_verification.yml'
  schedule:
    - cron: '17 10 * * 1'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic research dependencies
        run: python -m pip install pandas numpy pyarrow
      - name: Causal regime unit tests
        run: python -m unittest discover -s research -p 'test_astra_*.py' -v
      - name: Frozen ASTRA discovery setup run
        run: python astra6_causal_transition_engine.py
      - name: Classify frozen setups against completed 15m bars
        run: python research/astra_regime_shadow_existing_setups.py
      - name: Compare causal regime definitions
        run: python research/astra_regime_experiments.py
      - name: Upload research-only findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-causal-regime-shadow
          if-no-files-found: warn
          path: |
            astra6_causal_summary.csv
            astra_regime_shadow_setups.csv
            astra_regime_shadow_census.csv
            astra_regime_experiment_summary.csv
            astra_regime_experiment_setups.csv
