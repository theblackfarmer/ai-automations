name: ASTRA research verification
on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 1'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Causal regime unit tests
        run: python -m unittest discover -s research -p 'test_astra_market_regime.py' -v
